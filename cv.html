<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CV — Experience</title>
    <link rel="preconnect" href="https://esm.sh" crossorigin>
    <link rel="stylesheet" href="./assets/css/cv.css" />
  </head>
  <body>
    <div id="app"></div>

    <script type="module">
      import React, { useEffect, useMemo, useState } from 'https://esm.sh/react@18';
      import { createRoot } from 'https://esm.sh/react-dom@18/client';

      const h = React.createElement;

      const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      function parseStartDate(duration) {
        if (!duration || typeof duration !== 'string') return new Date(0);
        // Find the first "Mon, YYYY" anywhere in the string
        const m = duration.match(/([A-Za-z]{3,9}),\s*(\d{4})/);
        if (!m) return new Date(0);
        const [_, mon, yearStr] = m;
        const year = parseInt(yearStr, 10) || 0;
        // map month prefix (e.g., Apr, April) to index
        const idx = MONTHS.findIndex(abbr => mon.toLowerCase().startsWith(abbr.toLowerCase()));
        const monthIdx = idx >= 0 ? idx : 0;
        return new Date(year, monthIdx, 1);
      }

      function Summary({ item }) {
        const cls = 'xp-summary';
        if (item.summary_html) {
          return h('div', { className: cls, dangerouslySetInnerHTML: { __html: item.summary_html } });
        }
        if (item.summary) {
          return h('p', { className: cls }, item.summary);
        }
        return null;
      }

      function ExperienceItem({ item }) {
        return h('article', { className: 'xp-item' },
          h('header', { className: 'xp-header' },
            h('div', { className: 'xp-titles' },
              h('h3', { className: 'xp-role' }, item.position || '—'),
              h('div', { className: 'xp-company' }, item.company || '')
            ),
            item.duration
              ? h('div', { className: 'xp-duration', dangerouslySetInnerHTML: { __html: item.duration } })
              : null
          ),
          h(Summary, { item })
        );
      }

      function App() {
        const [items, setItems] = useState([]);
        const [education, setEducation] = useState([]);
        const [skills, setSkills] = useState([]);
        const [error, setError] = useState(null);
        const [loading, setLoading] = useState(true);
  const [profile, setProfile] = useState(null);
  const [showMore, setShowMore] = useState(false);

        useEffect(() => {
          (async () => {
            try {
              const [resExp, resEdu, resSk, resProf] = await Promise.all([
                fetch('./assets/data/experience.json', { cache: 'no-store' }),
                fetch('./assets/data/education.json', { cache: 'no-store' }),
                fetch('./assets/data/skills.json', { cache: 'no-store' }),
                fetch('./assets/data/profile.json', { cache: 'no-store' })
              ]);
              if (!resExp.ok) throw new Error(`Failed to load experience.json: ${resExp.status}`);
              if (!resEdu.ok) throw new Error(`Failed to load education.json: ${resEdu.status}`);
              if (!resSk.ok) throw new Error(`Failed to load skills.json: ${resSk.status}`);
              if (!resProf.ok) throw new Error(`Failed to load profile.json: ${resProf.status}`);
              const [data, eduData, skData, profData] = await Promise.all([resExp.json(), resEdu.json(), resSk.json(), resProf.json()]);
              // Expose for future graph tooling
              window.__experienceData = data;
              window.__educationData = eduData;
              window.__skillsData = skData;
              window.__profileData = profData;
              data.sort((a, b) => parseStartDate(b.duration) - parseStartDate(a.duration));
              setItems(data);
              setEducation(eduData);
              setSkills(skData);
              setProfile(profData);
            } catch (e) {
              console.error('Failed to fetch experience JSON', e);
              setError(e);
            } finally {
              setLoading(false);
            }
          })();
        }, []);

        const onPrint = () => window.print();

  const FIRST_VISIBLE = 3;
  const visibleItems = useMemo(() => items.slice(0, FIRST_VISIBLE), [items]);
  const hiddenItems = useMemo(() => items.slice(FIRST_VISIBLE), [items]);
  const hiddenCount = hiddenItems.length;

  return h('main', { className: 'cv-root' },
          profile && h('section', { className: 'cv-profile' },
            h('img', {
              className: 'cv-avatar',
              src: profile.avatar,
              alt: `${profile.name} avatar`,
              onError: (e) => { e.currentTarget.style.display = 'none'; }
            }),
            h('div', { className: 'cv-ident' },
              h('h1', { className: 'cv-name' }, profile.name),
              h('p', { className: 'cv-titleline' }, profile.title),
              h('div', { className: 'cv-contact' },
                profile.location ? h('span', { className: 'cv-location' }, profile.location) : null,
                profile.email ? h('a', { className: 'cv-email', href: `mailto:${profile.email}` }, profile.email) : null,
                Array.isArray(profile.links) ? h('span', { className: 'cv-links' },
                  profile.links.map((l, i) => h('a', { key: i, href: l.url, target: '_blank', rel: 'noopener noreferrer' }, l.label))
                ) : null
              )
            )
          ),
          h('section', { className: 'cv-header' },
            h('div', { className: 'cv-title-wrap' },
              h('h1', { className: 'cv-title' }, 'Curriculum Vitae'),
              h('p', { className: 'cv-subtitle' }, 'Professional Experience')
            ),
            h('div', { className: 'cv-actions no-print' },
              h('button', { className: 'btn', onClick: onPrint }, 'Print / Save PDF')
            )
          ),
          loading && h('p', { className: 'status' }, 'Loading experience…'),
          error && h('p', { className: 'status error' }, String(error)),
          !loading && !error && h('section', { className: 'xp-list' },
            visibleItems.map((item, idx) => h(ExperienceItem, { item, key: (item.id ? `top-${item.id}` : `top-${idx}`) }))
          ),
          !loading && !error && hiddenCount > 0 && h('div', { className: 'xp-more no-print' },
            h('button', {
              className: 'btn',
              'aria-expanded': showMore,
              onClick: () => setShowMore(v => !v)
            }, showMore ? 'Show less' : `Show more (${hiddenCount})`),
            showMore && h('section', { className: 'xp-list xp-list--more', role: 'region', 'aria-label': 'More experience' },
              hiddenItems.map((item, idx) => h(ExperienceItem, { item, key: (item.id ? `more-${item.id}` : `more-${idx}`) }))
            )
          ),
          !loading && !error && h('section', { className: 'edu-list' },
            h('h2', null, 'Education'),
            education.map((ed, i) => h('article', { className: 'edu-item', key: i },
              h('header', { className: 'edu-header' },
                h('div', { className: 'edu-degree' }, `${ed.degree} — ${ed.uni}`),
                h('div', { className: 'edu-year', dangerouslySetInnerHTML: { __html: ed.year } })
              ),
              h('div', { className: 'edu-note' }, ed.note ? `Grade: ${ed.note}` : ''),
              h('div', { className: 'edu-summary' }, ed.summary || '')
            ))
          ),
          !loading && !error && h('section', { className: 'skills-list' },
            h('h2', null, 'Skills'),
            h('ul', null,
              skills.map((sk, i) => h('li', { key: i },
                h('strong', null, sk.skill),
                sk.description ? ` — ${sk.description}` : ''
              ))
            )
          )
        );
      }

      const root = createRoot(document.getElementById('app'));
      root.render(h(App));
    </script>
  </body>
  </html>
